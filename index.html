<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FairTrade — Weekly Trade Values</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="brand-block">
      <h1>FairTrade</h1>
      <p class="week-title" id="week-title"></p>
    </div>
    <nav class="site-nav">
      <a href="index.html" class="active">Rankings</a>
      <a href="calculator.html">Calculator</a>
    </nav>
  </header>

  <p class="subhead">Consolidated trade values, normalized so no single source skews the average.</p>

  <div class="rank-controls-top">
    <input class="search-input" id="search" type="text" placeholder="Search a player...">
  </div>

  <div id="sections"></div>

</div>

<script src="data.js"></script>
<script>
document.getElementById('week-title').textContent = WEEK_SUBTITLE;

const SECTIONS = [
  { pos: 'QB', label: 'QB', fmt1: 'oneQB', fmt1Label: '1QB', fmt2: 'twoQB', fmt2Label: '2QB' },
  { pos: 'RB', label: 'RB', fmt1: 'ppr', fmt1Label: 'PPR', fmt2: 'half', fmt2Label: 'Half PPR' },
  { pos: 'WR', label: 'WR', fmt1: 'ppr', fmt1Label: 'PPR', fmt2: 'half', fmt2Label: 'Half PPR' },
  { pos: 'TE', label: 'TE', fmt1: 'ppr', fmt1Label: 'PPR', fmt2: 'half', fmt2Label: 'Half PPR' },
];

const grouped = SECTIONS.map(sec => {
  const players = PLAYERS.filter(p => p.pos === sec.pos)
    .slice()
    .sort((a, b) => (b[sec.fmt1] || 0) - (a[sec.fmt1] || 0))
    .map((p, i) => Object.assign({}, p, { rank: i + 1 }));
  return Object.assign({}, sec, { players });
});

function fmtVal(v) {
  return v == null ? '\u2014' : v.toFixed(1);
}

function renderSections(query) {
  const container = document.getElementById('sections');
  const q = query.trim().toLowerCase();

  container.innerHTML = grouped.map(sec => {
    const rows = q === '' ? sec.players : sec.players.filter(p => p.name.toLowerCase().includes(q));
    if (rows.length === 0) return '';
    const rowsHtml = rows.map(p =>
      '<tr>' +
        '<td class="num rank-num">' + p.rank + '</td>' +
        '<td>' + p.name + '</td>' +
        '<td class="num rank-value">' + fmtVal(p[sec.fmt1]) + '</td>' +
        '<td class="num rank-value">' + fmtVal(p[sec.fmt2]) + '</td>' +
      '</tr>'
    ).join('');
    return (
      '<div class="position-section">' +
        '<p class="position-heading">' + sec.label + '</p>' +
        '<div class="rank-panel">' +
          '<table class="rank-table">' +
            '<thead><tr>' +
              '<th class="num">Rank</th><th>Player</th>' +
              '<th class="num">' + sec.fmt1Label + '</th>' +
              '<th class="num">' + sec.fmt2Label + '</th>' +
            '</tr></thead>' +
            '<tbody>' + rowsHtml + '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>'
    );
  }).join('');

  if (container.innerHTML === '') {
    container.innerHTML = '<p class="subhead">No players match your search.</p>';
  }
}

renderSections('');

document.getElementById('search').addEventListener('input', (e) => {
  renderSections(e.target.value);
});
</script>
</body>
</html>
